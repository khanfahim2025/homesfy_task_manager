<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homesfy Task Manager</title>
    <script>
      // Apply the theme before first paint (same key as ThemeContext); dark by default.
      (function () {
        var dark = true;
        try { dark = localStorage.getItem('homesfy:theme:v2') !== 'light'; } catch (e) {}
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
